[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dit-cifar10"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy", "torchvision"]

[project.optional-dependencies]
dev = ["pytest"]
eval = ["torch-fidelity", "diffusers", "scipy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages]
find = {}
